name: lostlink

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8088}:8080"
    volumes:
      - ./deployments/docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge

  web:
    build:
      context: .
      dockerfile: deployments/docker/web.Dockerfile
      target: development
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - edge

  api:
    build:
      context: .
      dockerfile: deployments/docker/api.Dockerfile
      target: development
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://lostlink:replace-me-local-only@postgres:5432/lostlink?sslmode=disable}
      AI_SERVICE_URL: http://ai:8000
      STORAGE_ENDPOINT: minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-lostlink-dev}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-replace-me-local-only}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-replace-me-local-only}
      STORAGE_USE_SSL: "false"
    volumes:
      - ./apps/api:/app
    tmpfs:
      - /app/tmp
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - backend

  ai:
    build:
      context: .
      dockerfile: deployments/docker/ai.Dockerfile
      target: development
    restart: unless-stopped
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./apps/ai:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lostlink}
      POSTGRES_USER: ${POSTGRES_USER:-lostlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -path=/migrations
      - -database=${DATABASE_URL:-postgres://lostlink:replace-me-local-only@postgres:5432/lostlink?sslmode=disable}
      - up
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-replace-me-local-only}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-me-local-only}
    volumes:
      - minio_data:/data
    networks:
      - backend

networks:
  edge:
    internal: false
  backend:
    internal: true

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
