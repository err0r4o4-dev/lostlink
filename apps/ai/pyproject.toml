[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lostlink-ai"
version = "0.1.0"
description = "Internal LostLink AI service bootstrap"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
ml = [
  "numpy>=2.2,<3",
  "pillow>=11,<12",
  "scikit-learn>=1.6,<2",
  "sentence-transformers>=4,<6",
  "torch>=2.7,<3",
  "transformers>=4.51,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
