openapi: 3.1.0
info:
  title: LostLink API
  version: 0.4.0
  description: |
    # Introduction
    Public REST API for the LostLink university Lost & Found platform. The Go
    API is the only public backend. Similarity assists discovery and never
    proves ownership.

    # Current scope
    Health, authentication, report lifecycle and images, matching, claims,
    verification decisions, return tracking, notifications, AI chat, and staff
    review are implemented. Matching is an uncertain discovery aid and cannot
    approve a claim.

    # Authentication
    Access tokens are short-lived JWT bearer tokens. Refresh tokens are opaque,
    rotated on every refresh, and carried only by an HttpOnly SameSite cookie.
    Browser calls to authentication mutation endpoints must include the exact
    configured `Origin` header.
servers:
  - url: /api
    description: Public API through Caddy
  - url: /
    description: Go API when run directly
tags:
  - name: Operations
    description: Process health
  - name: Authentication
    description: Account and session lifecycle
  - name: Chat
    description: Authenticated AI-assisted conversations with atomic turn persistence
  - name: Reports
    description: Public-safe lost and found reporting and discovery
  - name: Matching
    description: Authorized public-safe similarity results; never ownership proof
  - name: Claims
    description: Restricted ownership claims and evidence
  - name: Tracking
    description: Authorized return arrangements and timelines
  - name: Notifications
    description: Authenticated in-app workflow updates
  - name: Staff
    description: Staff and admin review operations
  - name: Admin
    description: Admin-only audit history
paths:
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Get API health
      responses:
        "200":
          description: API process is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create a user account and session
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "201":
          $ref: "#/components/responses/SessionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/OriginRejected"
        "409":
          description: The normalized identifier is already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Start a session
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid identifier or password; account existence is not disclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/OriginRejected"
        "429":
          description: Too many attempts for this normalized identifier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: Requires the HttpOnly `lostlink_refresh` cookie set by register or login.
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          $ref: "#/components/responses/SessionOK"
        "401":
          description: Cookie missing, invalid, expired, revoked, or reused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/OriginRejected"
  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current refresh session
      description: Idempotent when no refresh cookie is present.
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Session revoked and refresh cookie cleared
        "403":
          $ref: "#/components/responses/OriginRejected"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated account
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current public account fields
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                additionalProperties: false
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /v1/auth/google/start:
    get:
      tags: [Authentication]
      operationId: startGoogleSignIn
      summary: Start Google OpenID Connect sign-in
      description: Sets short-lived HttpOnly state, PKCE verifier, and nonce cookies before redirecting to Google.
      responses:
        "302":
          description: Redirect to Google's authorization endpoint
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly, SameSite=Lax transient OAuth cookies with a ten-minute lifetime
        "503":
          description: Google OAuth is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/auth/google/callback:
    get:
      tags: [Authentication]
      operationId: completeGoogleSignIn
      summary: Validate Google's authorization response
      description: Exchanges the authorization code with PKCE, validates the Google ID token and nonce, creates a local refresh session, then redirects to the fixed web callback page. Google tokens are not persisted.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "303":
          description: Redirect to `/auth/callback`, with a generic error marker when verification fails
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            Set-Cookie:
              schema: { type: string }
              description: Clears transient cookies and, on success, sets the HttpOnly refresh cookie
  /v1/chats:
    get:
      tags: [Chat]
      operationId: listChatSessions
      summary: List the authenticated account's chat sessions
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Chat sessions ordered by most recently updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSessionList" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Chat]
      operationId: createChatSession
      summary: Create a chat session with its first completed turn
      description: |
        The API generates the AI reply before persistence, then commits the
        session, user message, and AI message atomically. If AI generation
        fails, no session or message is stored. Reuse the same `client_turn_id`
        only when retrying the identical logical submission.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatTurnRequest" }
      responses:
        "201":
          description: Session and first user/AI turn created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatTurnResponse" }
        "400": { $ref: "#/components/responses/ChatBadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/ChatAIUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/chats/{sessionId}:
    delete:
      tags: [Chat]
      operationId: deleteChatSession
      summary: Delete an owned chat session and its messages
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Chat session deleted }
        "400": { $ref: "#/components/responses/ChatBadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/chats/{sessionId}/messages:
    get:
      tags: [Chat]
      operationId: listChatMessages
      summary: List messages in an owned chat session
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Messages ordered from oldest to newest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessageList" }
        "400": { $ref: "#/components/responses/ChatBadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Chat]
      operationId: appendChatTurn
      summary: Append one completed user/AI turn
      description: |
        The user and AI messages are committed in one transaction only after a
        valid AI reply is available. AI failure leaves the stored conversation
        unchanged. Reusing the same `client_turn_id` for the identical retry
        returns the already committed turn instead of creating a duplicate.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatTurnRequest" }
      responses:
        "200":
          description: User and AI messages committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatTurnResponse" }
        "400": { $ref: "#/components/responses/ChatBadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/ChatAIUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/chats/{sessionId}/messages/{messageId}:
    put:
      tags: [Chat]
      operationId: replaceChatTurn
      summary: Replace a past user message and its future branch atomically
      description: |
        The original message and all later messages remain stored while the AI
        reply is generated. After generation succeeds, one transaction deletes
        that branch and inserts the edited user/AI pair. AI failure preserves
        the original conversation unchanged. Reuse `client_turn_id` only for an
        identical retry of this edit.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: messageId, in: path, required: true, description: User message where the new branch starts, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatTurnRequest" }
      responses:
        "200":
          description: Original branch replaced with the edited user/AI turn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatTurnResponse" }
        "400": { $ref: "#/components/responses/ChatBadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/ChatAIUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/reports:
    get:
      tags: [Reports]
      operationId: searchReports
      summary: Search active public-safe reports
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/ReportType" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200":
          $ref: "#/components/responses/ReportList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Reports]
      operationId: createReport
      summary: Create a lost or found report
      description: Private verification details are deliberately excluded.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReportRequest" }
      responses:
        "201":
          description: Report created, or the original response for an identical idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportEnvelope" }
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "409":
          description: Idempotency-Key was reused with different content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/reports/mine:
    get:
      tags: [Reports]
      operationId: listMyReports
      summary: List reports owned by the authenticated account
      security:
        - BearerAuth: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200":
          $ref: "#/components/responses/ReportList"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /v1/reports/{reportId}:
    get:
      tags: [Reports]
      operationId: getReport
      summary: Get an active public-safe report
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Public-safe report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportEnvelope" }
        "404":
          description: Report not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      tags: [Reports]
      operationId: updateReport
      summary: Update an active report owned by the authenticated user
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateReportRequest" }
      responses:
        "200": { description: Report updated, content: { application/json: { schema: { $ref: "#/components/schemas/ReportEnvelope" } } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /v1/reports/{reportId}/withdraw:
    post:
      tags: [Reports]
      operationId: withdrawReport
      summary: Withdraw an active owned report
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Report withdrawn, content: { application/json: { schema: { $ref: "#/components/schemas/ReportEnvelope" } } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
  /v1/reports/{reportId}/images:
    get:
      tags: [Reports]
      operationId: listReportImages
      summary: List public-safe images for an active report
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Report images
          content:
            application/json:
              schema:
                type: object
                required: [images]
                properties:
                  images: { type: array, items: { $ref: "#/components/schemas/ReportImage" } }
                additionalProperties: false
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Reports]
      operationId: uploadReportImage
      summary: Upload and sanitize an image for an active owned report
      description: Accepts JPEG or PNG only, up to 8 MiB after sanitization and five images per report.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "201":
          description: Sanitized image stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportImageEnvelope" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/reports/{reportId}/images/{imageId}:
    get:
      tags: [Reports]
      operationId: getReportImageContent
      summary: Stream a public-safe report image
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: JPEG or PNG image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [Reports]
      operationId: deleteReportImage
      summary: Delete an image from an active owned report
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Image deleted }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/reports/{reportId}/matching-runs:
    post:
      tags: [Matching]
      operationId: runReportMatching
      summary: Generate versioned potential matches for an owned lost report
      description: Uses public-safe fields only. A score never verifies ownership or approves a claim.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201":
          description: Matching run completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchingRunEnvelope" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429":
          description: More than five new matching runs were requested by the account within one minute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/reports/{reportId}/matches:
    get:
      tags: [Matching]
      operationId: listReportMatches
      summary: List potential matches visible to the report owner or staff
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ranked public-safe candidates
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches: { type: array, items: { $ref: "#/components/schemas/Match" } }
                additionalProperties: false
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/matches/{matchId}:
    get:
      tags: [Matching]
      operationId: getMatch
      summary: Get one authorized potential match
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Potential match, content: { application/json: { schema: { $ref: "#/components/schemas/MatchEnvelope" } } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/claims:
    post:
      tags: [Claims]
      operationId: createClaim
      summary: Create a private draft claim from an authorized match
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [match_id]
              properties:
                match_id: { type: string, format: uuid }
              additionalProperties: false
      responses:
        "201": { description: Claim draft created, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimEnvelope" } } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /v1/claims/mine:
    get:
      tags: [Claims]
      operationId: listMyClaims
      summary: List claims owned by the authenticated user
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200": { description: Claim page, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimList" } } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
  /v1/claims/{claimId}:
    get:
      tags: [Claims]
      operationId: getClaim
      summary: Get a claim and its restricted evidence
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Authorized claim detail, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimEnvelope" } } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/claims/{claimId}/evidence:
    post:
      tags: [Claims]
      operationId: addClaimEvidence
      summary: Add private ownership evidence to an editable claim
      description: Send JSON for a statement or multipart data for a sanitized JPEG/PNG image.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimStatementRequest" }
          multipart/form-data:
            schema:
              type: object
              required: [description, image]
              properties:
                description: { type: string, minLength: 10, maxLength: 2000 }
                image: { type: string, format: binary }
      responses:
        "201": { description: Evidence added, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceEnvelope" } } } }
