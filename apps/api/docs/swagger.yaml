        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token returned by register, login, or refresh.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: Must exactly match the configured WEB_ORIGIN.
      schema:
        type: string
        format: uri
      example: http://localhost:8088
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated once per logical submission and reused only for an identical retry.
      schema: { type: string, format: uuid }
  responses:
    ChatBadRequest:
      description: Malformed JSON, an invalid UUID, a missing client turn id, or a request body larger than 20 KiB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ChatAIUnavailable:
      description: AI generation failed; the submitted turn and any edit cutoff were not persisted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    SessionCreated:
      description: Account created; rotated refresh credential is set as an HttpOnly cookie
      headers:
        Set-Cookie:
          schema: { type: string }
          description: HttpOnly, SameSite=Strict refresh-token cookie
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SessionResponse" }
    SessionOK:
      description: Session issued; rotated refresh credential is set as an HttpOnly cookie
      headers:
        Set-Cookie:
          schema: { type: string }
          description: HttpOnly, SameSite=Strict refresh-token cookie
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SessionResponse" }
    BadRequest:
      description: Malformed JSON, missing fields, or request body larger than 16 KiB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: Request fields fail semantic validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    OriginRejected:
      description: Origin is absent or does not match WEB_ORIGIN
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AuthenticationRequired:
      description: Bearer token is missing, invalid, or expired
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Authenticated account lacks the required role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource is absent or deliberately concealed from this account
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    StateConflict:
      description: Current workflow state or idempotency state rejects the action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServiceUnavailable:
      description: A required internal AI or object storage dependency is unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: Request failed without exposing an internal error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ReportList:
      description: Bounded report page
      content:
        application/json:
          schema:
            type: object
            required: [reports, pagination]
            properties:
              reports:
                type: array
                items: { $ref: "#/components/schemas/Report" }
              pagination: { $ref: "#/components/schemas/Pagination" }
            additionalProperties: false
  schemas:
    ChatTurnRequest:
      type: object
      required: [message, client_turn_id]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: Must contain at least one non-whitespace character.
        client_turn_id:
          type: string
          format: uuid
          description: Stable UUID generated once by the client and reused for an identical retry.
      additionalProperties: false
    ChatSession:
      type: object
      required: [id, user_id, title, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    ChatMessage:
      type: object
      required: [id, session_id, role, content, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        role: { type: string, enum: [user, ai, system] }
        content: { type: string }
        analysis_data:
          description: Optional structured AI analysis retained with an AI message.
        created_at: { type: string, format: date-time }
      additionalProperties: false
    ChatSessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/ChatSession" }
      additionalProperties: false
    ChatMessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
      additionalProperties: false
    ChatTurnResponse:
      type: object
      required: [session, user_message, ai_message]
      properties:
        session: { $ref: "#/components/schemas/ChatSession" }
        user_message: { $ref: "#/components/schemas/ChatMessage" }
        ai_message: { $ref: "#/components/schemas/ChatMessage" }
      additionalProperties: false
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string, examples: [ok] }
        service: { type: string, examples: [api] }
      additionalProperties: false
    CredentialsRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
          description: Case-insensitive login identifier, normalized by the server.
          examples: [student@example.edu]
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
      additionalProperties: false
    User:
      type: object
      required: [id, identifier, role, created_at]
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string }
        role:
          type: string
          enum: [user, staff, admin]
        created_at: { type: string, format: date-time }
      additionalProperties: false
    SessionResponse:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
          writeOnly: true
