name: Quality gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-audit:
    name: Repository audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check patch whitespace
        run: git show --check --format= --no-renames HEAD
      - name: Audit repository
        if: always()
        run: python .github/scripts/repository_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lostlink-quality-report
          path: .artifacts/quality-report.json
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  web-e2e:
    name: Web bootstrap smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium

  api:
    name: Go format, vet, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal docs)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /tmp/lostlink-api ./cmd/api

  ai:
    name: AI lint, test, import
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -c "from app.main import app; assert app.title == 'LostLink Internal AI'"

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example config --quiet
