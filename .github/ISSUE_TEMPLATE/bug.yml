name: Bug report
description: Record a reproducible bug and return it to the original feature owner.
title: "[BUG-] "
labels: ["bug"]
body:
  - type: input
    id: task
    attributes:
      label: Bug task ID
      placeholder: BUG-FE-04-01 or BUG-matching-01
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and acceptance check
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe logs, screenshots, or test evidence

