version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    target-branch: develop
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - automation
